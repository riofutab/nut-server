name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build project
        run: go build ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Protocol fuzz smoke
        run: go test -run '^$' -fuzz=FuzzReadEnvelope -fuzztime=30s ./internal/protocol/

      - name: E2E tests
        run: go test -race -tags e2e -count=1 ./internal/e2e/...

      - name: Build Linux artifacts
        run: ./scripts/build-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nut-server-build-artifacts
          path: |
            dist/linux-amd64
            dist/linux-arm64

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check shell scripts
        run: |
          status=0
          for f in scripts/*.sh packaging/nfpm/*.sh; do
            dash -n "$f" || status=1
            bash -n "$f" || status=1
          done
          shellcheck --version
          shellcheck -S warning scripts/*.sh packaging/nfpm/*.sh || status=1
          exit "$status"

  # Installs the .deb packages on a real systemd host and checks that the shipped
  # unit + sudoers let the services pass their shutdown-command self-check.
  #
  # The runner cannot be powered off even though dry_run is false: the master
  # polls SNMP at 127.0.0.1 where nothing listens, so it never gets a UPS status,
  # never matches a policy, never issues a shutdown command to the slave and never
  # runs local_shutdown. The self-check only runs `sudo -n -l`, which lists
  # permissions without executing the command. The admin token is random and
  # nothing calls the admin API.
  packaging-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.41.3"
          NFPM_DEB_SHA256: "f92bf886c0f96767abcdc17195449faadb93fb20105532609820a412b4b2a46f"
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          echo "${NFPM_DEB_SHA256}  /tmp/nfpm.deb" | sha256sum -c -
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build packages
        run: VERSION=v0.0.0-ci ./scripts/package-release.sh

      - name: Install and start nut-slave
        run: |
          sudo dpkg -i dist/release/nut-slave_0.0.0-ci_linux_amd64.deb
          cat > /tmp/slave.yaml <<EOF
          node_id: "ci-slave"
          master_addr: "127.0.0.1:9000"
          token: "$(openssl rand -hex 24)"
          state_file: "/var/lib/nut-server/slave-state.json"
          reconnect_interval: "5s"
          dry_run: false
          tls:
            disabled: true
          shutdown_command:
            - "/usr/bin/sudo"
            - "-n"
            - "/sbin/shutdown"
            - "-h"
            - "now"
          EOF
          sudo install -o root -g nut-server -m 0640 /tmp/slave.yaml /etc/nut-server/slave.yaml
          rm -f /tmp/slave.yaml
          sudo -u nut-server /usr/local/bin/nut-slave -check-config -config /etc/nut-server/slave.yaml
          sudo systemctl enable --now nut-slave

      - name: Install and start nut-master
        run: |
          sudo dpkg -i dist/release/nut-master_0.0.0-ci_linux_amd64.deb
          cat > /tmp/master.yaml <<EOF
          listen_addr: "127.0.0.1:9000"
          admin_listen_addr: "127.0.0.1:9001"
          admin_token: "$(openssl rand -hex 24)"
          state_file: "/var/lib/nut-server/master-state.json"
          enrollment_tokens:
            - "$(openssl rand -hex 24)"
          poll_interval: "10s"
          command_timeout: "30s"
          dry_run: false
          tls:
            disabled: true
          shutdown_policies:
            - name: critical
              when:
                runtime_below: 15
          local_shutdown:
            enabled: true
            command:
              - "/usr/bin/sudo"
              - "-n"
              - "/sbin/shutdown"
              - "-h"
              - "now"
            max_wait: "15m"
            emergency_runtime_minutes: 5
          snmp:
            target: "127.0.0.1"
            port: 161
            community: "public"
            version: "2c"
            timeout_seconds: 2
          EOF
          sudo install -o root -g nut-server -m 0640 /tmp/master.yaml /etc/nut-server/master.yaml
          rm -f /tmp/master.yaml
          sudo -u nut-server /usr/local/bin/nut-master -check-config -config /etc/nut-server/master.yaml
          sudo systemctl enable --now nut-master

      - name: Check shutdown command self-check
        run: |
          wait_self_check() {
            unit="$1"
            for _ in $(seq 1 20); do
              log=$(sudo journalctl -u "$unit" -o cat --no-pager)
              if printf '%s\n' "$log" | grep -q 'shutdown command self-check failed'; then
                echo "::error::$unit shutdown command self-check failed"
                printf '%s\n' "$log"
                return 1
              fi
              if printf '%s\n' "$log" | grep -q 'shutdown command self-check passed'; then
                echo "$unit shutdown command self-check passed"
                return 0
              fi
              sleep 1
            done
            echo "::error::$unit did not report a shutdown command self-check within 20s"
            sudo systemctl status "$unit" --no-pager || true
            printf '%s\n' "$log"
            return 1
          }
          status=0
          wait_self_check nut-slave || status=1
          wait_self_check nut-master || status=1
          exit "$status"

      - name: Upgrade in place keeps services enabled and restarts them
        run: |
          status=0
          for role in slave master; do
            unit="nut-$role"
            before=$(systemctl show -p InvocationID --value "$unit")
            out=$(sudo dpkg -i "dist/release/nut-${role}_0.0.0-ci_linux_amd64.deb" 2>&1) || status=1
            printf '%s\n' "$out"
            after=$(systemctl show -p InvocationID --value "$unit")
            if ! systemctl is-active --quiet "$unit"; then
              echo "::error::$unit is not running after the upgrade"
              status=1
            fi
            if ! systemctl is-enabled --quiet "$unit"; then
              echo "::error::$unit is no longer enabled after the upgrade"
              status=1
            fi
            if [ "$before" = "$after" ]; then
              echo "::error::$unit was not restarted onto the new binary"
              status=1
            fi
          done
          exit "$status"

      # Packages before v0.6.0 stop and disable the service in prerm on every
      # upgrade, before any script of the new package runs. Build the current
      # tree as 0.5.99 with that prerm, then upgrade it to 0.6.99: the service
      # stays stopped and postinst prints the commands to start it again.
      - name: Upgrade from a pre-v0.6.0 package prints the restart commands
        run: |
          build_deb() {
            role="$1"
            version="$2"
            prerm="$3"
            sed \
              -e 's|${NFPM_ARCH}|amd64|g' \
              -e 's|${BUILD_ARCH}|amd64|g' \
              -e "s|\${VERSION}|$version|g" \
              -e "s|packaging/nfpm/$role.prerm.sh|$prerm|" \
              "packaging/nfpm/$role.yaml" > "/tmp/nfpm-$role.yaml"
            nfpm pkg --config "/tmp/nfpm-$role.yaml" --packager deb --target "/tmp/nut-${role}_${version}.deb"
          }
          status=0
          for role in slave master; do
            unit="nut-$role"
            printf '#!/bin/sh\nsystemctl stop %s || true\nsystemctl disable %s || true\n' "$unit" "$unit" > "/tmp/old-$role.prerm.sh"
            build_deb "$role" 0.5.99-ci "/tmp/old-$role.prerm.sh"
            build_deb "$role" 0.6.99-ci "packaging/nfpm/$role.prerm.sh"
            sudo dpkg -i "/tmp/nut-${role}_0.5.99-ci.deb"
            out=$(sudo dpkg -i "/tmp/nut-${role}_0.6.99-ci.deb" 2>&1) || status=1
            printf '%s\n' "$out"
            if ! printf '%s\n' "$out" | grep -q "package stopped and disabled $unit during this upgrade"; then
              echo "::error::$unit postinst did not print the restart commands"
              status=1
            fi
            if ! printf '%s\n' "$out" | grep -qF "sudo systemctl enable --now $unit"; then
              echo "::error::$unit postinst did not print the enable command"
              status=1
            fi
            if printf '%s\n' "$out" | grep -q "restarted on the new version"; then
              echo "::error::$unit postinst reported a restart that did not happen"
              status=1
            fi
            if systemctl is-active --quiet "$unit"; then
              echo "::error::$unit is running after the old prerm stopped it"
              status=1
            fi
          done
          exit "$status"
