name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: E2E tests
        run: go test -race -tags e2e -count=1 ./internal/e2e/...

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.41.3"
          NFPM_DEB_SHA256: "f92bf886c0f96767abcdc17195449faadb93fb20105532609820a412b4b2a46f"
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          echo "${NFPM_DEB_SHA256}  /tmp/nfpm.deb" | sha256sum -c -
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          # Tags with a suffix (v0.6.0-rc.1) are pre-releases: GitHub does not
          # list them as latest, so install-online.sh --version latest skips them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            See the release notes below for details about this version and the packaged artifacts.
          body_path: .github/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.deb
            dist/release/*.rpm
            dist/release/SHA256SUMS
